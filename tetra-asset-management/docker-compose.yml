version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USER:-admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DATABASE_NAME:-tetra_dev}

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile # You will create this later
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://${DATABASE_USER:-admin}:${DATABASE_PASSWORD:-password}@postgres:5432/${DATABASE_NAME:-tetra_dev}?schema=public"
      NODE_ENV: development # or production
      # Add other backend environment variables here
    volumes:
      - ./src/backend:/usr/src/app
      - /usr/src/app/node_modules # Mount node_modules separately to avoid overriding
    command: npm run dev # or npm start for production

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile # You will create this later
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      - backend
    environment:
      VITE_API_URL: "http://localhost:${BACKEND_PORT:-3001}"
      # Add other frontend environment variables here
    volumes:
      - ./src/frontend:/usr/src/app
      - /usr/src/app/node_modules # Mount node_modules separately to avoid overriding
    command: npm run dev

volumes:
  postgres_data:
